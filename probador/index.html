<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Probador MCP</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fuentes/mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fuentes/pixel.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/probador.css" />
    <script type="module" src="/probador.js"></script>
  </head>
  <body>
    <header>
      <span class="marca">mwc<span class="accent">/</span>taller</span>
      <code id="endpoint" class="muted"></code>
    </header>

    <!-- Solo en los retos: el servidor de la carpeta solucion está en /solucion/mcp -->
    <nav id="pestanas" class="pestanas" aria-label="Código que se está ejecutando" hidden>
      <a href="/">Tu código</a>
      <a href="/solucion/">Ver solución</a>
    </nav>

    <main>
      <h1 id="servidor">MCP</h1>
      <p id="estado" class="muted" role="status">Conectando…</p>

      <section id="chat" aria-labelledby="titulo-chat">
        <div class="cabecera">
          <h2 id="titulo-chat">Chat <span id="modelo" class="muted"></span></h2>
          <button type="button" id="nueva">Nueva conversación</button>
        </div>
        <p id="disponibles" class="muted"></p>
        <ol id="mensajes" aria-live="polite"></ol>
        <p id="pensando" class="muted" hidden>Pensando…</p>
        <form id="pregunta">
          <input name="texto" placeholder="Pregunta algo…" aria-label="Tu pregunta" autocomplete="off" required />
          <button type="submit">Enviar ▸</button>
        </form>
      </section>

      <section aria-labelledby="titulo-herramientas">
        <h2 id="titulo-herramientas">Probar herramientas</h2>
        <ul id="herramientas"></ul>
      </section>
    </main>
  </body>
</html>
